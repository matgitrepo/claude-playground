name: Market Intel — Collect Skills from SerpAPI

on:
  schedule:
    - cron: '0 2 * * *'   # Daily at 02:00 UTC
  workflow_dispatch:        # Manual trigger from GitHub Actions tab

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Market Intel - Collect skills from SERPAPI
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          WORKER_URL: ${{ secrets.MARKET_INTEL_WORKER_URL }}
          COLLECT_SECRET: ${{ secrets.MARKET_INTEL_COLLECT_SECRET }}
        run: node collect.js
        working-directory: market-intel/scraper
